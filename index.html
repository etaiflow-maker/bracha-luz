<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#f7f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171513" media="(prefers-color-scheme: dark)">
<title>ברכה · לוח הפרסומים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500&family=Heebo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f3ee; --panel: #fffdfa; --line: #e6ded3; --fg: #221e1a; --muted: #7a7067;
    --accent: #8a5a44; --story: #a2466b; --story-bg: #f6e3ea; --post: #3d5a73; --post-bg: #e2ebf2;
    --reel: #6a5a2c; --reel-bg: #f1ebd3; --ok: #4a7a55; --warn: #a8641f; --bad: #a33a2e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171513; --panel: #201d1a; --line: #37322d; --fg: #efe9e1; --muted: #a2978b;
      --accent: #d3a188; --story: #eba3bf; --story-bg: #47253a; --post: #a9c6de; --post-bg: #24384a;
      --reel: #dccb8f; --reel-bg: #3f381e; --ok: #8fc79b; --warn: #e3a964; --bad: #ee9085;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: Heebo, system-ui, -apple-system, "Segoe UI", Arial, sans-serif; font-size: 16px; line-height: 1.45; }
  .wrap { max-width: 40rem; margin-inline: auto; padding: 0 16px calc(32px + env(safe-area-inset-bottom)); }
  header { padding: 22px 0 10px; }
  .brand { font-family: "Frank Ruhl Libre", "Times New Roman", serif; font-weight: 500; font-size: 1.75rem; margin: 0; letter-spacing: .01em; }
  .brand small { font-family: Heebo, system-ui, sans-serif; font-weight: 400; font-size: .95rem; color: var(--muted); margin-inline-start: .4em; }
  .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .85rem; margin-top: 4px; min-height: 1.4em; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
  .dot.stale { background: var(--warn); } .dot.err { background: var(--bad); }
  .refresh { margin-inline-start: auto; font: inherit; font-size: .85rem; color: var(--accent); background: none; border: 0; padding: 8px 0 8px 8px; cursor: pointer; }
  .bar { position: sticky; top: 0; z-index: 3; background: var(--bg); border-bottom: 1px solid var(--line); }
  .tabs { display: flex; gap: 6px; padding: 8px 0 6px; }
  .filters { display: flex; gap: 6px; padding: 0 0 8px; overflow-x: auto; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .filter { flex: none; font: inherit; font-size: .88rem; min-height: 36px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .filter[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }
  .filter .n { font-variant-numeric: tabular-nums; opacity: .7; margin-inline-start: .35em; }
  .filter:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tab { flex: 1; font: inherit; font-weight: 500; padding: 10px 8px; min-height: 44px; border-radius: 10px; border: 1px solid transparent; background: transparent; color: var(--muted); cursor: pointer; }
  .tab[aria-selected="true"] { background: var(--panel); border-color: var(--line); color: var(--fg); }
  .tab .n { font-variant-numeric: tabular-nums; font-weight: 400; opacity: .75; margin-inline-start: .3em; }
  .tab:focus-visible, .refresh:focus-visible, .row:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  h2.day { position: sticky; top: var(--bar-h, 108px); z-index: 2; background: var(--bg); margin: 0; padding: 16px 0 8px; font-size: .95rem; font-weight: 600; display: flex; gap: 8px; align-items: baseline; }
  h2.day .sub { color: var(--muted); font-weight: 400; font-size: .85rem; }
  h2.day.today .name { color: var(--accent); }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .row { display: grid; grid-template-columns: 56px 1fr; gap: 12px; width: 100%; text-align: start; font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px; cursor: pointer; }
  .thumb { width: 56px; height: 70px; border-radius: 8px; background: var(--line); object-fit: cover; display: block; }
  .thumb.story { height: 99px; }
  .thumb.none { display: grid; place-items: center; color: var(--muted); font-size: .7rem; }
  .body { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .time { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 1.05rem; }
  .chip { font-size: .75rem; font-weight: 500; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
  .chip.story { color: var(--story); background: var(--story-bg); }
  .chip.post { color: var(--post); background: var(--post-bg); }
  .chip.reel { color: var(--reel); background: var(--reel-bg); }
  .flag { font-size: .75rem; color: var(--warn); white-space: nowrap; }
  .flag.ok { color: var(--ok); } .flag.bad { color: var(--bad); }
  .title { font-weight: 500; overflow-wrap: anywhere; }
  .plat { color: var(--muted); font-size: .85rem; }
  .more { grid-column: 1 / -1; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 2px; display: none; flex-direction: column; gap: 10px; }
  .row[aria-expanded="true"] .more { display: flex; }
  .cap { white-space: pre-wrap; margin: 0; font-size: .92rem; line-height: 1.6; overflow-wrap: anywhere; }
  .cap.empty { color: var(--muted); }
  .more a { color: var(--accent); font-size: .9rem; align-self: flex-start; padding: 6px 0; }
  .empty-state, .error-state { color: var(--muted); padding: 40px 0; text-align: center; }
  .error-state { color: var(--bad); }
  footer { color: var(--muted); font-size: .78rem; padding-top: 28px; text-align: center; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: no-preference) { .row { transition: border-color .15s; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="brand">ברכה <small>לוח הפרסומים</small></h1>
    <div class="status" aria-live="polite">
      <span class="dot" id="dot"></span>
      <span id="statusText">טוען…</span>
      <button class="refresh" id="refresh" type="button">רענון</button>
    </div>
  </header>

  <div class="bar" id="bar">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-upcoming" aria-selected="true" aria-controls="view" type="button">מתוכנן<span class="n" id="n-upcoming"></span></button>
      <button class="tab" role="tab" id="tab-recent" aria-selected="false" aria-controls="view" type="button">עלה לאחרונה<span class="n" id="n-recent"></span></button>
    </div>
    <div class="filters" role="group" aria-label="סינון לפי סוג">
      <button class="filter" type="button" data-filter="all" aria-pressed="true">הכול<span class="n"></span></button>
      <button class="filter" type="button" data-filter="post" aria-pressed="false">פוסטים<span class="n"></span></button>
      <button class="filter" type="button" data-filter="story" aria-pressed="false">סטוריז<span class="n"></span></button>
      <button class="filter" type="button" data-filter="reel" aria-pressed="false">רילס<span class="n"></span></button>
    </div>
  </div>

  <main id="view" role="tabpanel"></main>
  <footer>מתעדכן לבד אחרי כל פרסום ואחרי כל שינוי בתור · שעון ישראל</footer>
</div>

<script>
(function () {
  "use strict";
  // קובץ הנתונים: גרסה מצומצמת של התור, שהאוטומציה מעלה אחרי כל פרסום.
  // כדי להעביר את הדף למרכז השליטה מספיק לקחת את הקובץ הזה כמו שהוא.
  var DATA_URL = "https://cfivyyrmjonwrpdsaxhj.supabase.co/storage/v1/object/public/story-images/luz/luz.json";
  var TZ = "Asia/Jerusalem";
  var REFRESH_MS = 2 * 60 * 1000;
  var STALE_MS = 26 * 60 * 60 * 1000; // האוטומציה רצה לפחות פעם ביום; מעבר לזה משהו תקוע

  var KIND = {
    story: { label: "סטורי", cls: "story" },
    reel: { label: "ריל", cls: "reel" },
    product: { label: "פוסט", cls: "post" },
    campaign: { label: "פוסט", cls: "post" }
  };
  var PLATFORM = { instagram: "אינסטגרם", facebook: "פייסבוק", tiktok: "טיקטוק" };
  var DAYS = ["יום ראשון", "יום שני", "יום שלישי", "יום רביעי", "יום חמישי", "יום שישי", "שבת"];

  var data = null, tab = "upcoming", filter = "all", openKey = null, lastOk = 0, lastError = false;
  var FILTER_EMPTY = { post: "פוסטים", story: "סטוריז", reel: "רילס" };
  try { var saved = localStorage.getItem("luz-filter"); if (saved && (saved === "all" || FILTER_EMPTY[saved])) filter = saved; } catch (e) {}

  function kindCls(r) { return (KIND[r.kind] || KIND.product).cls; }
  function byFilter(rows) {
    return filter === "all" ? rows : rows.filter(function (r) { return kindCls(r) === filter; });
  }
  var view = document.getElementById("view");

  var fmtKey = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" });
  var fmtTime = new Intl.DateTimeFormat("he-IL", { timeZone: TZ, hour: "2-digit", minute: "2-digit", hour12: false });
  var fmtWd = new Intl.DateTimeFormat("en-US", { timeZone: TZ, weekday: "short" });
  var WD = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };

  function dayKey(d) { return fmtKey.format(d); }
  function dayTitle(d) {
    var key = dayKey(d), now = new Date();
    var p = key.split("-");
    var date = Number(p[2]) + "." + Number(p[1]);
    var name = DAYS[WD[fmtWd.format(d)]];
    var rel = "";
    if (key === dayKey(now)) rel = "היום";
    else if (key === dayKey(new Date(now.getTime() + 86400000))) rel = "מחר";
    else if (key === dayKey(new Date(now.getTime() - 86400000))) rel = "אתמול";
    return { name: rel || name, sub: rel ? name + " · " + date : date, today: rel === "היום" };
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function safeUrl(u) { return typeof u === "string" && /^https:\/\//.test(u) ? u : null; }

  function rowEl(r, mode) {
    var when = new Date(mode === "recent" ? (r.doneAt || r.at) : r.at);
    var key = mode + "|" + r.at + "|" + r.title;
    var kind = KIND[r.kind] || KIND.product;

    var row = el("button", "row");
    row.type = "button";
    row.setAttribute("aria-expanded", key === openKey ? "true" : "false");

    var src = safeUrl(r.thumb);
    var thumb;
    if (src) {
      thumb = el("img", "thumb" + (r.kind === "story" ? " story" : ""));
      thumb.loading = "lazy"; thumb.decoding = "async"; thumb.alt = "";
      thumb.referrerPolicy = "no-referrer";
      thumb.src = src;
      thumb.onerror = function () { thumb.replaceWith(el("div", "thumb none", "אין תמונה")); };
    } else {
      thumb = el("div", "thumb none", r.video ? "וידאו" : "אין תמונה");
    }
    row.appendChild(thumb);

    var body = el("div", "body");
    var top = el("div", "top");
    top.appendChild(el("span", "time", fmtTime.format(when)));
    top.appendChild(el("span", "chip " + kind.cls, kind.label));
    if (mode === "upcoming" && new Date(r.at).getTime() < Date.now()) top.appendChild(el("span", "flag", "בדרך לעלות"));
    if (mode === "recent") top.appendChild(el("span", "flag ok", "עלה ✓"));
    if (mode === "failed") top.appendChild(el("span", "flag bad", "נכשל"));
    body.appendChild(top);
    // התווית "סטורי" כבר מופיעה בצ'יפ, אז לא חוזרים עליה בשם.
    var title = String(r.title || "").replace(/^סטורי\s*[:—–-]\s*/, "");
    body.appendChild(el("div", "title", title || "ללא שם"));
    var plats = (r.platforms || []).map(function (p) { return PLATFORM[p] || p; }).join(" + ");
    if (r.count > 1 && r.kind !== "story") plats += " · " + r.count + " תמונות";
    body.appendChild(el("div", "plat", plats));
    row.appendChild(body);

    var more = el("div", "more");
    if (mode === "upcoming") {
      more.appendChild(r.caption
        ? el("p", "cap", r.caption)
        : el("p", "cap empty", r.kind === "story" ? "סטורי עולה בלי כיתוב." : "אין כיתוב."));
    }
    var link = safeUrl(r.link);
    if (link) {
      var a = el("a", null, "לעמוד המוצר באתר");
      a.href = link; a.target = "_blank"; a.rel = "noopener noreferrer";
      a.addEventListener("click", function (e) { e.stopPropagation(); });
      more.appendChild(a);
    }
    if (more.childNodes.length) row.appendChild(more);

    row.addEventListener("click", function () {
      openKey = openKey === key ? null : key;
      render();
    });
    return row;
  }

  function renderList(rows, mode, into) {
    var current = null, list = null;
    rows.forEach(function (r) {
      var d = new Date(mode === "recent" ? (r.doneAt || r.at) : r.at);
      var key = dayKey(d);
      if (key !== current) {
        current = key;
        var t = dayTitle(d);
        var h = el("h2", "day" + (t.today ? " today" : ""));
        h.appendChild(el("span", "name", t.name));
        h.appendChild(el("span", "sub", t.sub));
        into.appendChild(h);
        list = el("div", "list");
        into.appendChild(list);
      }
      list.appendChild(rowEl(r, mode));
    });
  }

  function render() {
    var y = window.scrollY;
    view.textContent = "";
    if (!data) {
      view.appendChild(el("p", lastError ? "error-state" : "empty-state",
        lastError ? "לא הצלחתי לטעון את הלוח. מנסה שוב בעוד רגע." : "טוען…"));
      return;
    }
    document.getElementById("n-upcoming").textContent = data.upcoming.length;
    document.getElementById("n-recent").textContent = data.recent.length;

    // המספר על כל כפתור סינון מתייחס ללשונית הפתוחה.
    var base = tab === "upcoming" ? data.upcoming : data.recent;
    Array.prototype.forEach.call(document.querySelectorAll(".filter"), function (b) {
      var f = b.getAttribute("data-filter");
      b.setAttribute("aria-pressed", String(f === filter));
      b.querySelector(".n").textContent = f === "all" ? base.length
        : base.filter(function (r) { return kindCls(r) === f; }).length;
    });
    var what = filter === "all" ? "פרסומים" : FILTER_EMPTY[filter];

    if (tab === "upcoming") {
      var failed = byFilter(data.failed || []);
      if (failed.length) {
        var h = el("h2", "day"); h.appendChild(el("span", "name", "נכשלו")); view.appendChild(h);
        var fl = el("div", "list");
        failed.forEach(function (r) { fl.appendChild(rowEl(r, "failed")); });
        view.appendChild(fl);
      }
      var up = byFilter(data.upcoming);
      if (!up.length) view.appendChild(el("p", "empty-state", "אין כרגע " + what + " מתוכננים."));
      else renderList(up, "upcoming", view);
    } else {
      var rec = byFilter(data.recent);
      if (!rec.length) view.appendChild(el("p", "empty-state", "לא עלו " + what + " בשבועיים האחרונים."));
      else renderList(rec, "recent", view);
    }
    window.scrollTo(0, y);
  }

  function renderStatus() {
    var dot = document.getElementById("dot"), text = document.getElementById("statusText");
    dot.className = "dot";
    if (!data) { text.textContent = lastError ? "אין חיבור" : "טוען…"; if (lastError) dot.classList.add("err"); return; }
    var gen = new Date(data.generatedAt), age = Date.now() - gen.getTime();
    var when = dayKey(gen) === dayKey(new Date()) ? "היום ב-" + fmtTime.format(gen) : dayTitle(gen).name + " ב-" + fmtTime.format(gen);
    if (lastError) { dot.classList.add("err"); text.textContent = "אין חיבור כרגע · נתונים מ" + when; }
    else if (age > STALE_MS) { dot.classList.add("stale"); text.textContent = "לא התעדכן מאז " + when; }
    else text.textContent = "עודכן " + when;
  }

  function load() {
    return fetch(DATA_URL + "?t=" + Date.now(), { cache: "no-store" })
      .then(function (res) { if (!res.ok) throw new Error(res.status); return res.json(); })
      .then(function (j) {
        if (!j || !Array.isArray(j.upcoming) || !Array.isArray(j.recent)) throw new Error("shape");
        var changed = !data || data.generatedAt !== j.generatedAt;
        data = j; lastOk = Date.now(); lastError = false;
        if (changed) render();
      })
      .catch(function () { lastError = true; if (!data) render(); })
      .then(renderStatus);
  }

  function selectTab(name) {
    tab = name; openKey = null;
    document.getElementById("tab-upcoming").setAttribute("aria-selected", String(name === "upcoming"));
    document.getElementById("tab-recent").setAttribute("aria-selected", String(name === "recent"));
    window.scrollTo(0, 0);
    render();
  }
  document.getElementById("tab-upcoming").addEventListener("click", function () { selectTab("upcoming"); });
  document.getElementById("tab-recent").addEventListener("click", function () { selectTab("recent"); });
  Array.prototype.forEach.call(document.querySelectorAll(".filter"), function (b) {
    b.addEventListener("click", function () {
      filter = b.getAttribute("data-filter"); openKey = null;
      try { localStorage.setItem("luz-filter", filter); } catch (e) {}
      window.scrollTo(0, 0);
      render();
    });
  });
  // כותרות הימים נדבקות מתחת לסרגל, שגובהו תלוי בגודל הגופן במכשיר.
  function setBarHeight() {
    document.documentElement.style.setProperty("--bar-h", document.getElementById("bar").offsetHeight + "px");
  }
  window.addEventListener("resize", setBarHeight);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(setBarHeight);
  setBarHeight();
  document.getElementById("refresh").addEventListener("click", load);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && Date.now() - lastOk > 30000) load();
  });
  setInterval(function () { if (!document.hidden) load(); }, REFRESH_MS);
  // "בדרך לעלות" ו"היום/מחר" תלויים בשעה, גם כשהנתונים לא השתנו.
  setInterval(function () { if (!document.hidden && data) { render(); renderStatus(); } }, 60000);

  render();
  load();
})();
</script>
</body>
</html>
